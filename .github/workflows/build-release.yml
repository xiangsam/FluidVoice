name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Build Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Fluid.xcodeproj -scheme Fluid \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Re-sign app (adhoc) — unsigned CI builds leave a broken linker signature
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/MlxVoice.app"
          test -d "$APP"
          # Unsigned xcodebuild builds produce a linker-signed bundle whose
          # signature no longer matches after zip/re-disk, so macOS reports
          # "app is damaged". An adhoc deep re-sign produces a self-consistent
          # bundle that opens normally (first launch via right-click→Open).
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/MlxVoice.app"
          echo "Using APP=$APP"
          test -d "$APP"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tag builds (v1.0.0) name the artifact after the tag so the zip
            # always matches the release it was published under. Strip a
            # leading 'v' from the tag to avoid "MlxVoice-vv1.0.0.zip".
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(defaults read "$APP/Contents/Info" CFBundleShortVersionString)"
          fi
          mkdir -p release
          ditto -c -k --keepParent "$APP" "release/MlxVoice-v${VERSION}.zip"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MlxVoice-v${{ env.APP_VERSION }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
