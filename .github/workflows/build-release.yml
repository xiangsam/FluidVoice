name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Fluid.xcodeproj -scheme Fluid \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(xcodebuild -project Fluid.xcodeproj -scheme Fluid -showBuildSettings 2>/dev/null | awk '/ BUILT_PRODUCTS_DIR =/{d=$3} / WRAPPER_NAME =/{w=$3} END{print d "/" w}')"
          echo "APP=$APP"
          if [ ! -d "$APP" ]; then
            APP="DerivedData/Build/Products/Release/FluidVoice.app"
          fi
          if [ ! -d "$APP" ]; then
            APP="$(find ~/Library/Developer/Xcode/DerivedData -name 'FluidVoice.app' -path '*Release*' 2>/dev/null | head -1)"
          fi
          echo "Using APP=$APP"
          test -d "$APP"
          VERSION="$(defaults read "$APP/Contents/Info" CFBundleShortVersionString)"
          mkdir -p release
          ditto -c -k --keepParent "$APP" "release/FluidVoice-v${VERSION}.zip"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidVoice-v${{ env.APP_VERSION }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
